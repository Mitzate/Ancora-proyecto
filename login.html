<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Autenticación | Tu Proyecto</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <!-- Bootstrap CSS -->
    <link href="lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- FUENTES CORREGIDAS -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Space Grotesk", sans-serif;
        }

        .auth-container {
            min-height: 100vh;
            background: linear-gradient(rgba(3, 32, 31, 0.82), rgba(3, 32, 31, 0.82)),
                        url('img/hero-bg.jpg') center center no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .auth-card {
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.22);
            overflow: hidden;
            max-width: 440px;
            width: 100%;
        }

        /* HEADER */
        .auth-header {
            background: #0d6b68;
            color: #fff;
            padding: 22px 28px 18px;
            text-align: center;
        }
        .auth-header h2 {
            font-family: "Cormorant Garamond", serif;
            font-weight: 500;
            font-size: 24px;
        }
        .auth-header p {
            font-size: 13px;
            color: rgba(255,255,255,0.72);
        }

        /* TABS */
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #e6f0ef;
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            background: #f8fafa;
            border: none;
            font-size: 13.5px;
            color: #7a9a97;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .auth-tab.active {
            background: #fff;
            color: #0d6b68;
            border-bottom: 2px solid #0d6b68;
        }

        .auth-body { padding: 28px; }

        .auth-content { display: none; }
        .auth-content.active { display: block; }

        /* INPUTS */
        .form-control {
            height: 46px;
            border: 1.5px solid #ddecea;
            padding: 0 14px 0 40px;
            border-radius: 4px;
            font-size: 14px;
            background: #fafcfb;
            width: 100%;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 14px;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a8c5c2;
        }

        /* FILA */
        .form-row-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            font-size: 12.5px;
            color: #7a9a97;
        }

        .forgot-link {
            color: #0d6b68;
            text-decoration: none;
            font-weight: 500;
        }

        /* BOTÓN */
        .btn-primary {
            height: 48px;
            width: 100%;
            background: #0d6b68;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
        }

        /* LINKS */
        .auth-switch, .back-home {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #7a9a97;
        }

        .auth-switch a, .back-home a {
            color: #0d6b68;
            text-decoration: none;
            font-weight: 500;
        }

    </style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <h2>Bienvenido</h2>
            <p>Accede a tu cuenta o regístrate</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Iniciar Sesión</button>
            <button class="auth-tab" data-tab="register">Registrarse</button>
        </div>

        <div class="auth-body">

            <!-- LOGIN -->
            <div id="login" class="auth-content active">
                <form>

                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control" placeholder="Correo electrónico">
                    </div>

                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" placeholder="Contraseña">
                    </div>

                    <div class="form-row-meta">
                        <label>
                            <input type="checkbox"> Recordarme
                        </label>
                        <a href="recuperar_contra.html" class="forgot-link">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <button class="btn-primary">Iniciar Sesión</button>
                </form>

                <div class="auth-switch">
                    ¿No tienes cuenta? <a href="#" data-tab="register">Regístrate aquí</a>
                </div>
            </div>

            <!-- REGISTER -->
            <div id="register" class="auth-content">
                <form>

                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control" placeholder="Nombre">
                    </div>

                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control" placeholder="Correo">
                    </div>

                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" placeholder="Contraseña">
                    </div>

                    <button class="btn-primary">Registrarse</button>
                </form>
            </div>

            <div class="back-home">
                <a href="index.html">← Volver al inicio</a>
            </div>

        </div>

    </div>
</div>

<script>
document.querySelectorAll('[data-tab]').forEach(el => {
    el.addEventListener('click', function(e) {
        e.preventDefault();
        const target = this.dataset.tab;

        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-content').forEach(c => c.classList.remove('active'));

        document.querySelector(`.auth-tab[data-tab="${target}"]`).classList.add('active');
        document.getElementById(target).classList.add('active');
    });
});
</script>

</body>
</html>
