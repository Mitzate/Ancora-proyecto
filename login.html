<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ancora — Iniciar sesión</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --teal:    #0c8078;
            --teal-lt: #4db8ad;
            --dark:    #060e0d;
            --dark2:   #0a1614;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── Fondo con orbes animados ── */
        .login-bg {
            position: fixed; inset: 0; z-index: 0;
            background: var(--dark);
            overflow: hidden;
        }
        .login-bg::before {
            content: "";
            position: absolute;
            width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(12,128,120,0.22) 0%, transparent 65%);
            filter: blur(80px);
            top: -150px; left: -150px;
            animation: orbFloat 14s ease-in-out infinite;
        }
        .login-bg::after {
            content: "";
            position: absolute;
            width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle, rgba(77,184,173,0.12) 0%, transparent 65%);
            filter: blur(70px);
            bottom: -100px; right: -100px;
            animation: orbFloat 18s ease-in-out infinite reverse;
        }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0); }
            50%      { transform: translate(30px,-30px); }
        }

        /* Grid de fondo sutil */
        .login-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(12,128,120,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(12,128,120,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ── Card principal ── */
        .login-card {
            position: relative; z-index: 2;
            width: 100%; max-width: 460px;
            margin: 20px;
            background: rgba(10,22,20,0.70);
            backdrop-filter: blur(32px) saturate(1.5);
            -webkit-backdrop-filter: blur(32px) saturate(1.5);
            border: 1px solid rgba(77,184,173,0.18);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow:
                0 40px 80px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.05),
                0 0 60px rgba(12,128,120,0.08);
            animation: cardIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes cardIn {
            from { opacity:0; transform:translateY(24px) scale(0.97); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }

        /* Orbe decorativo interno */
        .card-orb {
            position: absolute; top: -60px; right: -60px;
            width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, rgba(12,128,120,0.20) 0%, transparent 70%);
            filter: blur(30px); pointer-events: none;
        }

        /* ── Logo ── */
        .login-logo {
            font-family: 'Playfair Display', serif;
            font-weight: 900; font-size: 2rem;
            color: #fff; text-align: center;
            display: block; margin-bottom: 4px;
            letter-spacing: -0.5px;
            text-decoration: none;
        }
        .login-tagline {
            font-size: 0.65rem; font-weight: 400;
            letter-spacing: 4px; text-transform: uppercase;
            color: rgba(77,184,173,0.65);
            text-align: center; display: block;
            margin-bottom: 32px;
        }

        /* ── Tabs ── */
        .login-tabs {
            display: flex;
            background: rgba(6,14,13,0.50);
            border: 1px solid rgba(77,184,173,0.12);
            border-radius: 100px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .login-tab {
            flex: 1; padding: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem; font-weight: 400;
            color: rgba(255,255,255,0.35);
            background: none; border: none;
            cursor: pointer; border-radius: 100px;
            transition: all 0.3s;
        }
        .login-tab.active {
            background: linear-gradient(135deg, #0c8078, #063d38);
            color: #fff;
            box-shadow: 0 4px 14px rgba(12,128,120,0.35);
        }

        /* ── Paneles ── */
        .login-panel { display: none; }
        .login-panel.active { display: block; }

        /* ── Campos ── */
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 0.65rem; font-weight: 400;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: rgba(255,255,255,0.30);
            margin-bottom: 7px;
        }
        .field-wrap {
            position: relative;
        }
        .field-wrap i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: rgba(77,184,173,0.45); font-size: 0.82rem;
            pointer-events: none;
        }
        .field input {
            width: 100%;
            padding: 13px 16px 13px 40px;
            background: rgba(6,14,13,0.55);
            border: 1px solid rgba(77,184,173,0.15);
            border-radius: 10px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem; font-weight: 300;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .field input:focus {
            border-color: rgba(77,184,173,0.50);
            box-shadow: 0 0 0 3px rgba(12,128,120,0.14);
        }
        .field input::placeholder { color: rgba(255,255,255,0.18); }

        /* ── Checkbox ── */
        .check-row {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 14px;
        }
        .check-row input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: var(--teal);
            cursor: pointer;
        }
        .check-row label {
            font-size: 0.80rem; font-weight: 300;
            color: rgba(255,255,255,0.45); cursor: pointer;
        }

        /* ── Meta fila (recordarme + olvidé) ── */
        .meta-row {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .meta-row label {
            font-size: 0.80rem; font-weight: 300;
            color: rgba(255,255,255,0.40);
            display: flex; align-items: center; gap: 8px; cursor: pointer;
        }
        .meta-row label input { accent-color: var(--teal); }
        .meta-row a {
            font-size: 0.78rem; font-weight: 300;
            color: var(--teal-lt); text-decoration: none;
            transition: opacity 0.3s;
        }
        .meta-row a:hover { opacity: 0.75; }

        /* ── Botón submit ── */
        .btn-submit {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #0c8078 0%, #063d38 100%);
            border: none; border-radius: 10px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem; font-weight: 500;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 8px 24px rgba(12,128,120,0.30);
            margin-top: 4px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(12,128,120,0.42);
        }
        .btn-submit:disabled {
            opacity: 0.6; cursor: not-allowed; transform: none;
        }

        /* ── Mensaje de feedback ── */
        .msg-box {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 0.82rem; font-weight: 400;
            margin-bottom: 16px;
            display: none;
            animation: msgIn 0.3s ease;
        }
        @keyframes msgIn { from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);} }
        .msg-box.error   { background:rgba(179,38,30,0.15); color:#ff8a80; border:1px solid rgba(179,38,30,0.30); display:block; }
        .msg-box.success { background:rgba(12,128,120,0.15); color:#4db8ad; border:1px solid rgba(12,128,120,0.30); display:block; }

        /* ── Separador y footer ── */
        .login-sep {
            display: flex; align-items: center; gap: 12px;
            margin: 20px 0;
        }
        .login-sep::before, .login-sep::after {
            content: ""; flex: 1; height: 1px;
            background: rgba(255,255,255,0.07);
        }
        .login-sep span {
            font-size: 0.65rem; color: rgba(255,255,255,0.22);
            letter-spacing: 1px;
        }

        .login-footer {
            text-align: center;
            font-size: 0.80rem; font-weight: 300;
            color: rgba(255,255,255,0.28);
            margin-top: 4px;
        }
        .login-footer a {
            color: var(--teal-lt); text-decoration: none;
            transition: opacity 0.3s;
        }
        .login-footer a:hover { opacity: 0.75; }

        .back-link {
            display: block; text-align: center;
            margin-top: 24px;
            font-size: 0.78rem; font-weight: 300;
            color: rgba(255,255,255,0.22);
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--teal-lt); }

        /* ── Loading spinner en botón ── */
        .spinner-btn {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .login-card { padding: 36px 24px; }
        }
    </style>
</head>
<body>

<div class="login-bg"></div>
<div class="login-grid"></div>

<div class="login-card">
    <div class="card-orb"></div>

    <a href="index.html" class="login-logo">Áncora</a>
    <span class="login-tagline">Sistema de Monitoreo</span>

    <!-- Tabs -->
    <div class="login-tabs">
        <button class="login-tab active" data-panel="login">Iniciar sesión</button>
        <button class="login-tab" data-panel="register">Registrarse</button>
    </div>

    <!-- ══ PANEL LOGIN ══════════════════════════════════ -->
    <div class="login-panel active" id="panel-login">

        <div class="msg-box" id="msg-login"></div>

        <form id="loginForm" novalidate>

            <div class="field">
                <label>Correo electrónico</label>
                <div class="field-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="tu@email.com" autocomplete="email">
                </div>
            </div>

            <div class="field">
                <label>Contraseña</label>
                <div class="field-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                </div>
            </div>

            <div class="meta-row">
                <label><input type="checkbox" id="remember"> Recordarme</label>
                <a href="recuperar_contra.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit" id="btnLoginSubmit">
                Ingresar al sistema
            </button>

        </form>

        <div class="login-sep"><span>o</span></div>
        <div class="login-footer">
            ¿No tienes cuenta?
            <a href="#!" data-panel="register">Regístrate aquí</a>
        </div>

    </div>

    <!-- ══ PANEL REGISTRO ══════════════════════════════ -->
    <div class="login-panel" id="panel-register">

        <div class="msg-box" id="msg-register"></div>

        <form id="registerForm" novalidate>

            <div class="field">
                <label>Nombre(s)</label>
                <div class="field-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" id="registerName" placeholder="Tu nombre" autocomplete="given-name">
                </div>
            </div>

            <div class="field">
                <label>Apellido paterno</label>
                <div class="field-wrap">
                    <i class="fas fa-user-tag"></i>
                    <input type="text" id="registerApellidoPaterno" placeholder="Apellido paterno" autocomplete="family-name">
                </div>
            </div>

            <div class="field">
                <label>Apellido materno</label>
                <div class="field-wrap">
                    <i class="fas fa-user-tag"></i>
                    <input type="text" id="registerApellidoMaterno" placeholder="Apellido materno">
                </div>
            </div>

            <div class="field">
                <label>Correo electrónico</label>
                <div class="field-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="registerEmail" placeholder="tu@email.com" autocomplete="email">
                </div>
            </div>

            <div class="field">
                <label>Contraseña</label>
                <div class="field-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="registerPassword" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                </div>
            </div>

            <div class="field">
                <label>Confirmar contraseña</label>
                <div class="field-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="registerConfirmPassword" placeholder="Repite tu contraseña" autocomplete="new-password">
                </div>
            </div>

            <div class="check-row">
                <input type="checkbox" id="acceptTerms">
                <label for="acceptTerms">Acepto los términos y condiciones</label>
            </div>

            <button type="submit" class="btn-submit" id="btnRegisterSubmit">
                Crear cuenta
            </button>

        </form>

        <div class="login-sep"><span>o</span></div>
        <div class="login-footer">
            ¿Ya tienes cuenta?
            <a href="#!" data-panel="login">Inicia sesión</a>
        </div>

    </div>

    <a href="index.html" class="back-link">← Volver al inicio</a>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    var API_URL       = window.location.origin + '/api/coneccion.php';
    var DASHBOARD_URL = window.location.origin + '/Dashboard/dist/index2.html';

    /* ── Tabs ── */
    function switchPanel(name) {
        document.querySelectorAll('.login-tab').forEach(function(t){
            t.classList.toggle('active', t.dataset.panel === name);
        });
        document.querySelectorAll('.login-panel').forEach(function(p){
            p.classList.toggle('active', p.id === 'panel-' + name);
        });
    }

    document.querySelectorAll('[data-panel]').forEach(function(el){
        el.addEventListener('click', function(e){
            e.preventDefault();
            switchPanel(this.dataset.panel);
        });
    });

    /* ── Mensaje de feedback ── */
    function showMsg(panelName, text, type) {
        var el = document.getElementById('msg-' + panelName);
        if (!el) return;
        el.textContent = text;
        el.className   = 'msg-box ' + type;
        clearTimeout(el._t);
        el._t = setTimeout(function(){ el.className = 'msg-box'; }, 5000);
    }

    /* ── Botón loading ── */
    function setLoading(btn, loading, originalText) {
        if (loading) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-btn"></span>Procesando...';
        } else {
            btn.disabled = false;
            btn.textContent = originalText;
        }
    }

    /* ════════════════════════════════════════
       LOGIN
    ════════════════════════════════════════ */
    var loginForm = document.getElementById('loginForm');
    if (loginForm) {
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            var email    = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;
            var btn      = document.getElementById('btnLoginSubmit');

            if (!email || !password) {
                showMsg('login', 'Completa todos los campos.', 'error');
                return;
            }
            if (!/^[\w.\-]+@[\w.\-]+\.\w{2,}$/.test(email)) {
                showMsg('login', 'Correo electrónico no válido.', 'error');
                return;
            }

            setLoading(btn, true, 'Ingresar al sistema');

            try {
                var res  = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: true, correo: email, contrasena: password })
                });
                var text = await res.text();
                var data = null;

                try { data = text ? JSON.parse(text) : null; }
                catch(err) {
                    showMsg('login', 'Error del servidor: respuesta inválida.', 'error');
                    setLoading(btn, false, 'Ingresar al sistema');
                    return;
                }

                if (res.ok && data && data.success) {
                    if (data.nombre)     localStorage.setItem('nombre_usuario', data.nombre);
                    if (data.id_usuario) localStorage.setItem('id_usuario', data.id_usuario);

                    /* Busca dispositivo del usuario */
                    if (data.id_usuario) {
                        try {
                            var dRes  = await fetch(API_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ check_device: true, id_usuario: data.id_usuario })
                            });
                            var dData = await dRes.json();
                            if (dData.success && dData.hasDevice) {
                                var tipo = (dData.device.tipo_monitoreo || '').toLowerCase();
                                var modo = (tipo.includes('sueno') || tipo.includes('sueño')) ? 'sueno' : 'caidas';
                                localStorage.setItem('id_dispositivo', dData.device.id_dispositivo);
                                localStorage.setItem('monitoring_mode', modo);
                            }
                        } catch(err) { /* continúa igual */ }
                    }

                    showMsg('login', '¡Bienvenido! Redirigiendo...', 'success');
                    setTimeout(function(){ window.location.href = DASHBOARD_URL; }, 800);

                } else {
                    showMsg('login', (data && data.error) ? data.error : 'Correo o contraseña incorrectos.', 'error');
                    setLoading(btn, false, 'Ingresar al sistema');
                }

            } catch(err) {
                showMsg('login', 'Error de red: ' + err.message, 'error');
                setLoading(btn, false, 'Ingresar al sistema');
            }
        });
    }

    /* ════════════════════════════════════════
       REGISTRO
    ════════════════════════════════════════ */
    var registerForm = document.getElementById('registerForm');
    if (registerForm) {
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            var nombre = document.getElementById('registerName').value.trim();
            var ap     = document.getElementById('registerApellidoPaterno').value.trim();
            var am     = document.getElementById('registerApellidoMaterno').value.trim();
            var email  = document.getElementById('registerEmail').value.trim();
            var pass   = document.getElementById('registerPassword').value;
            var pass2  = document.getElementById('registerConfirmPassword').value;
            var terms  = document.getElementById('acceptTerms').checked;
            var btn    = document.getElementById('btnRegisterSubmit');

            if (!nombre || !ap || !am || !email || !pass || !pass2) {
                showMsg('register', 'Todos los campos son obligatorios.', 'error');
                return;
            }
            if (pass.length < 8) {
                showMsg('register', 'La contraseña debe tener mínimo 8 caracteres.', 'error');
                return;
            }
            if (pass !== pass2) {
                showMsg('register', 'Las contraseñas no coinciden.', 'error');
                return;
            }
            if (!terms) {
                showMsg('register', 'Debes aceptar los términos y condiciones.', 'error');
                return;
            }

            setLoading(btn, true, 'Crear cuenta');

            try {
                var res  = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        register: true,
                        nombre:            nombre,
                        apellido_paterno:  ap,
                        apellido_materno:  am,
                        correo:            email,
                        contrasena:        pass
                    })
                });
                var text = await res.text();
                var data = null;

                try { data = text ? JSON.parse(text) : null; }
                catch(err) {
                    showMsg('register', 'Error del servidor: respuesta inválida.', 'error');
                    setLoading(btn, false, 'Crear cuenta');
                    return;
                }

                if (res.status === 409) {
                    showMsg('register', (data && data.error) ? data.error : 'Este correo ya está en uso.', 'error');
                    setLoading(btn, false, 'Crear cuenta');
                    return;
                }

                if (res.ok && data && data.success) {
                    showMsg('register', '¡Cuenta creada! Ahora puedes iniciar sesión.', 'success');
                    registerForm.reset();
                    setTimeout(function(){ switchPanel('login'); }, 1500);
                } else {
                    showMsg('register', (data && data.error) ? data.error : 'Error al registrar usuario.', 'error');
                    setLoading(btn, false, 'Crear cuenta');
                }

            } catch(err) {
                showMsg('register', 'Error de red: ' + err.message, 'error');
                setLoading(btn, false, 'Crear cuenta');
            }
        });
    }

});
</script>

</body>
</html>
