<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Autenticación | Tu Proyecto</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <link href="lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- FUENTES CORRECTAS -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Space Grotesk", sans-serif;
        }

        .auth-container {
            min-height: 100vh;
            background: linear-gradient(rgba(3,32,31,0.82), rgba(3,32,31,0.82)),
                        url('img/hero-bg.jpg') center no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: #fff;
            border-radius: 4px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 16px 48px rgba(0,0,0,0.22);
        }

        .auth-header {
            background: #0d6b68;
            color: #fff;
            text-align: center;
            padding: 22px;
        }

        .auth-header h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 24px;
            font-weight: 500;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background: #f8fafa;
            border: none;
            cursor: pointer;
        }

        .auth-tab.active {
            background: #fff;
            border-bottom: 2px solid #0d6b68;
        }

        .auth-body { padding: 25px; }

        .auth-content { display: none; }
        .auth-content.active { display: block; }

        .input-wrapper {
            position: relative;
            margin-bottom: 14px;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .form-control {
            width: 100%;
            height: 46px;
            padding-left: 40px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-family: "Space Grotesk", sans-serif;
        }

        .btn-primary {
            width: 100%;
            height: 46px;
            background: #0d6b68;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .form-row-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .auth-switch, .back-home {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }

        a { color: #0d6b68; text-decoration: none; }

    </style>
</head>

<body>

<div class="auth-container">
<div class="auth-card">

<div class="auth-header">
    <h2>Bienvenido</h2>
    <p>Accede a tu cuenta o regístrate</p>
</div>

<div class="auth-tabs">
    <button class="auth-tab active" data-tab="login">Iniciar Sesión</button>
    <button class="auth-tab" data-tab="register">Registrarse</button>
</div>

<div class="auth-body">

<!-- LOGIN -->
<div id="login" class="auth-content active">
<form>

<div class="input-wrapper">
<i class="fas fa-envelope"></i>
<input type="email" class="form-control" placeholder="Correo electrónico">
</div>

<div class="input-wrapper">
<i class="fas fa-lock"></i>
<input type="password" class="form-control" placeholder="Contraseña">
</div>

<div class="form-row-meta">
<label><input type="checkbox"> Recordarme</label>
<a href="recuperar_contra.html">¿Olvidaste tu contraseña?</a>
</div>

<button class="btn-primary">Iniciar Sesión</button>
</form>

<div class="auth-switch">
¿No tienes cuenta? <a href="#" data-tab="register">Regístrate aquí</a>
</div>
</div>

<!-- REGISTER (CON TODOS TUS CAMPOS ORIGINALES) -->
<div id="register" class="auth-content">
<form>

<div class="input-wrapper">
<i class="fas fa-user"></i>
<input type="text" class="form-control" placeholder="Nombre(s)">
</div>

<div class="input-wrapper">
<i class="fas fa-user-tag"></i>
<input type="text" class="form-control" placeholder="Apellido paterno">
</div>

<div class="input-wrapper">
<i class="fas fa-user-tag"></i>
<input type="text" class="form-control" placeholder="Apellido materno">
</div>

<div class="input-wrapper">
<i class="fas fa-envelope"></i>
<input type="email" class="form-control" placeholder="Correo electrónico">
</div>

<div class="input-wrapper">
<i class="fas fa-lock"></i>
<input type="password" class="form-control" placeholder="Contraseña">
</div>

<div class="input-wrapper">
<i class="fas fa-lock"></i>
<input type="password" class="form-control" placeholder="Confirmar contraseña">
</div>

<div style="margin-bottom:10px;">
<label>
<input type="checkbox"> Acepto términos y condiciones
</label>
</div>

<button class="btn-primary">Registrarse</button>
</form>

<div class="auth-switch">
¿Ya tienes cuenta? <a href="#" data-tab="login">Inicia sesión</a>
</div>
</div>

<div class="back-home">
<a href="index.html">← Volver al inicio</a>
</div>

</div>
</div>
</div>

<script>
document.querySelectorAll('[data-tab]').forEach(el => {
    el.addEventListener('click', function(e) {
        e.preventDefault();
        const target = this.dataset.tab;

        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-content').forEach(c => c.classList.remove('active'));

        document.querySelector(`.auth-tab[data-tab="${target}"]`).classList.add('active');
        document.getElementById(target).classList.add('active');
    });
});
</script>

</body>
</html>
