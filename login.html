<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Autenticación | Tu Proyecto</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <!-- Bootstrap CSS -->
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
 <style>
        /* Estilos adicionales para el sistema de autenticación */
           * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .auth-container {
            min-height: 100vh;
            background: linear-gradient(rgba(3, 32, 31, 0.8), rgba(3, 32, 31, 0.8)), url('img/hero-bg.jpg') center center no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        
        .auth-card {
            background: #fff;
            border-radius: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        
        .auth-header {
            background: #0d6b68;  
            color: #fff;
            padding: 15px 20px;
            text-align: center;
        }
        
        .auth-header h2 {
            margin: 0;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 600;
        }
        
        .auth-body {
            padding: 15px 20px;
        }
        
        .auth-form .form-group {
            margin-bottom:10px;
        }
        
        .auth-form .form-control {
            height: 50px;
            border: 1px solid #e6f0ef;
            padding: 10px 15px;
            border-radius: 0;
            font-size: 16px;
        }
        
        .auth-form .form-control:focus {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 0.2rem rgba(13, 107, 104, 0.25);
        }
        
        .auth-form .btn {
            height: 50px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 0;
            width: 100%;
        }
        
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e6f0ef;
        }
        
        .auth-switch a {
            color: var(--bs-primary);
            font-weight: 600;
            text-decoration: none;
        }
        
        .auth-switch a:hover {
            text-decoration: underline;
        }
        
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #e6f0ef;
        }
        
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .auth-tab.active {
            background: #fff;
            color: var(--bs-primary);
            border-bottom: 2px solid var(--bs-primary);
        }
        
        .auth-content {
            display: none;
        }
        
        .auth-content.active {
            display: block;
        }
        
        .back-home {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-home a {
            color: var(--bs-secondary);
            text-decoration: none;
        }
        
        .back-home a:hover {
            color: var(--bs-primary);
        }

    
    </style>
</head>
<body>
    <!-- Spinner -->
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Cargando...</span>
        </div>
    </div>

    <!-- Sistema de Autenticación -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Bienvenido</h2>
                <p class="mb-0">Accede a tu cuenta o regístrate</p>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Iniciar Sesión</button>
                <button class="auth-tab" data-tab="register">Registrarse</button>
            </div>
            
            <div class="auth-body">
                <!-- Formulario de Login -->
                <div id="login" class="auth-content active">
                    <form class="auth-form" id="loginForm">
                        <div class="form-group">
                            <input type="email" class="form-control" id="loginEmail" placeholder="Correo electrónico" required>
                        </div>
                        <div class="form-group">
                            <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña" required>
                        </div>
                        <!--<div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Recordarme</label>
                            <a href="#" class="float-end">¿Olvidaste tu contraseña?</a>
                        </div>-->
                        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                    </form>
                    
                    <div class="auth-switch">
                        <p>¿No tienes una cuenta? <a href="#" data-tab="register">Regístrate aquí</a></p>
                    </div>
                </div>
                
                <!-- Formulario de Registro -->
                <div id="register" class="auth-content">
                    <form class="auth-form" id="registerForm">
                        <div class="form-group">
                            <input type="text" class="form-control" id="registerName" placeholder="Nombre(s)" required>
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control" id="registerApellidoPaterno" placeholder="Apellido paterno" required>
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control" id="registerApellidoMaterno" placeholder="Apellido materno" required>
                        </div>
                        <div class="form-group">
                            <input type="email" class="form-control" id="registerEmail" placeholder="Correo electrónico" required>
                        </div>
                        <div class="form-group">
                            <input type="password" class="form-control" id="registerPassword" placeholder="Contraseña" required>
                        </div>
                        <div class="form-group">
                            <input type="password" class="form-control" id="registerConfirmPassword" placeholder="Confirmar contraseña" required>
                        </div>
                        <div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="acceptTerms" required>
                            <label class="form-check-label" for="acceptTerms">Acepto los <a href="#">términos y condiciones</a></label>
                        </div>
                        <button type="submit" class="btn btn-primary">Registrarse</button>
                    </form>
                    
                    <div class="auth-switch">
                        <p>¿Ya tienes una cuenta? <a href="#" data-tab="login">Inicia sesión aquí</a></p>
                    </div>
                </div>
                
                <div class="back-home">
                    <a href="index.html"><i class="fas fa-arrow-left me-2"></i> Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./login.js?v=2"></script>
</body>
</html>
