    <div class="recovery-card">
 
        <div class="recovery-header">
            <div class="header-icon">
                <i class="fas fa-key"></i>
            </div>
            <h2>Recuperar contraseña</h2>
            <p>Te enviaremos un enlace seguro por correo</p>
        </div>
 
        <div class="step-bar">
            <div class="step-bar-fill" id="stepBarFill" style="width: 33%"></div>
        </div>
 
        <div class="recovery-body">
 
           
            <div id="formState">
                <div class="step-label">
                    <div class="step-badge">1</div>
                    <span class="step-text">Ingresa tu correo registrado</span>
                </div>
 
                <div class="form-group">
                    <label class="field-label" for="recoveryEmail">Correo electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control" id="recoveryEmail"
                               placeholder="tucorreo@ejemplo.com" autocomplete="email">
                    </div>
                    <p class="field-hint">Revisa también tu carpeta de spam tras el envío.</p>
                </div>
 
                <button class="btn-primary" id="submitBtn" onclick="handleSubmit()">
                    <div class="btn-spinner" id="btnSpinner"></div>
                    <i class="fas fa-paper-plane" id="btnIcon"></i>
                    <span id="btnText">Enviar enlace de recuperación</span>
                </button>
 
                <div class="divider"></div>
 
                <a href="login.html" class="back-link">
                    <i class="fas fa-arrow-left" style="font-size:12px;"></i>
                    Volver al inicio de sesión
                </a>
            </div>
 
            <div class="success-state" id="successState">
                <div class="success-icon-wrap">
                    <i class="fas fa-check"></i>
                </div>
                <p class="success-title">¡Correo enviado!</p>
                <p class="success-body">Hemos enviado el enlace de recuperación a:</p>
                <div class="email-tag" id="confirmedEmail">—</div>
                <p class="success-body">Haz clic en el enlace del correo para crear una nueva contraseña. Si no lo encuentras, revisa la carpeta de <strong>spam</strong>.</p>
                <p class="success-note"><i class="fas fa-clock" style="margin-right:4px;"></i>El enlace expirará en <strong>15 minutos</strong>.</p>
 
                <div class="divider"></div>
 
                <p class="resend-wrap">
                    ¿No recibiste el correo?
                    <a class="resend-link" onclick="resetForm()">Intentar de nuevo</a>
                </p>
 
                <div style="margin-top:14px;">
                    <a href="login.html" class="back-link">
                        <i class="fas fa-arrow-left" style="font-size:12px;"></i>
                        Volver al inicio de sesión
                    </a>
                </div>
            </div>
 
        </div>
    </div>
 
    <script>
        function handleSubmit() {
            const emailEl = document.getElementById('recoveryEmail');
            const email   = emailEl.value.trim();
            const valid   = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
 
            if (!valid) {
                emailEl.classList.add('error');
                emailEl.focus();
                setTimeout(() => emailEl.classList.remove('error'), 2500);
                return;
            }
 
            const btn     = document.getElementById('submitBtn');
            const spinner = document.getElementById('btnSpinner');
            const icon    = document.getElementById('btnIcon');
            const text    = document.getElementById('btnText');
 
            btn.disabled           = true;
            spinner.style.display  = 'block';
            icon.style.display     = 'none';
            text.textContent       = 'Enviando…';
            document.getElementById('stepBarFill').style.width = '66%';
 
            // ── Replace this timeout with your real API call ──
            // Example: fetch('/api/recuperar-contrasena', { method:'POST', body: JSON.stringify({email}) })
            setTimeout(() => {
                document.getElementById('stepBarFill').style.width = '100%';
                setTimeout(() => {
                    document.getElementById('confirmedEmail').textContent = email;
                    document.getElementById('formState').style.display    = 'none';
                    document.getElementById('successState').style.display = 'block';
                }, 300);
            }, 1800);
        }
 
        function resetForm() {
            document.getElementById('successState').style.display  = 'none';
            document.getElementById('formState').style.display     = 'block';
            document.getElementById('recoveryEmail').value         = '';
            document.getElementById('stepBarFill').style.width     = '33%';
 
            const btn = document.getElementById('submitBtn');
            btn.disabled = false;
            document.getElementById('btnSpinner').style.display = 'none';
            document.getElementById('btnIcon').style.display    = '';
            document.getElementById('btnText').textContent      = 'Enviar enlace de recuperación';
        }
 
        document.getElementById('recoveryEmail').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleSubmit();
        });
    </script>

   <script src="js/recuperar_contra.js"></script>

</body>
